name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Two jobs, as in the actions/deploy-pages docs. With upload and deploy in one job, deploy-pages
# looked up the artifact within a second of the upload and found none ("No artifacts named
# github-pages", 2026-11-28, twice). A separate job only starts once the upload is registered.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Strip dev-only files from the published site
        run: rm -rf CLAUDE.md README.md SEO.md package.json package-lock.json image.png .claude .github scripts node_modules images/originals

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
